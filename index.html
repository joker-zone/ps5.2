<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lea Games | Installer Hub</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #030712;
      --panel: #0d1524;
      --border: #202b3b;
      --text: #f4f7fb;
      --muted: #94a3b8;
      --accent: #078bd0;
      --accent-hover: #0a9de9;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 9px 16px 32px;
      background: var(--page);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, sans-serif;
    }

    main {
      width: min(100%, 960px);
      margin: 0 auto;
    }

    h1 {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 0 0 16px;
      color: #8da4bd;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    h1::after {
      height: 1px;
      flex: 1;
      background: #172130;
      content: "";
    }

    .options {
      display: grid;
      gap: 14px;
    }

    .option {
      display: flex;
      min-height: 78px;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 16px 20px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel);
    }

    .identity {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      border: 1px solid #29384c;
      border-radius: 11px;
      object-fit: contain;
      background: #101a2a;
    }

    .name {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
    }

    .description {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .actions {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 10px;
    }

    .button {
      display: inline-flex;
      min-height: 38px;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      border: 1px solid transparent;
      border-radius: 9px;
      background: var(--accent);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .button:hover { background: var(--accent-hover); }

    .button-secondary {
      border-color: #374355;
      background: #202a39;
      color: #e1e7ef;
    }

    .button-secondary:hover { background: #2a3749; }

    @media (max-width: 560px) {
      .option {
        align-items: flex-start;
        flex-direction: column;
        gap: 14px;
        padding: 15px;
      }

      .actions {
        width: 100%;
        justify-content: flex-end;
      }

      .button { padding: 0 14px; }
    }
  </style>
  <link rel="stylesheet" href="lea-games.css">
</head>
<body>
  <main>
    <header class="site-brand">
    </header>
    <h1>Choose your installer</h1>
    <section class="options" aria-label="Installers">
      <article class="option">
        <div class="identity">
          <img class="logo" src="Relapse-Installer/itsplk.jpg" alt="itsPLK">
          <div>
            <h2 class="name">itsPLK universal installer</h2>
            <p class="description">Universal installer for Relapse</p>
          </div>
        </div>
        <div class="actions">
          <a class="button" href="Relapse-Installer/index.html">Install &rarr;</a>
        </div>
      </article>

      <article class="option">
        <div class="identity">
          <div>
            <h2 class="name">Lea Games</h2>
            <p class="description">Lea Games installer for PS5</p>
          </div>
        </div>
        <div class="actions">
          <a class="button" href="Lea%20Games/Lea-Games.html">Open installer &rarr;</a>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
